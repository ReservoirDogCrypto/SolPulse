name: Update Solana report

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: solpulse-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Generate report
        id: report
        continue-on-error: true
        run: python3 solpulse.py --out public --history public/history.json

      - name: Report status
        run: |
          if [ "${{ steps.report.outcome }}" = "failure" ]; then
            echo "::warning::Report generated with critical anomalies present"
          fi

      - name: Persist snapshot history
        run: |
          if [ -f public/history.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f public/history.json
            git diff --staged --quiet || git commit -m "chore: update snapshot history"
            git push
          else
            echo "::warning::No history file produced; skipping persist"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
